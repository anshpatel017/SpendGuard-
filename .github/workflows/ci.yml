name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e "./backend[dev,detect,api]"

      - name: Lint
        run: python -m ruff check backend/src backend/tests

      - name: Format check
        run: python -m ruff format --check backend/src backend/tests

      - name: Type check
        run: python -m mypy --config-file backend/pyproject.toml backend/src

      - name: Tests
        run: python -m pytest backend --cov=spendguard --cov-report=term-missing

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
