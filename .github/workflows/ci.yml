name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e "./backend[dev,detect]"

      - name: Lint
        run: python -m ruff check backend/src backend/tests

      - name: Format check
        run: python -m ruff format --check backend/src backend/tests

      - name: Type check
        run: python -m mypy --config-file backend/pyproject.toml

      - name: Tests
        run: python -m pytest backend --cov=spendguard --cov-report=term-missing
