[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spendguard"
version = "0.1.0"
description = "Multi-agent system for evidence-grounded detection and investigation of procurement spend anomalies"
requires-python = ">=3.12"

# Core: needed from Phase 1 onward. Kept deliberately light.
dependencies = [
    # Capped below 2.0 deliberately. DuckDB 2.0 removes .pl() from both the
    # connection and the result object, and every detector, agent tool and API
    # handler calls it - a fresh `pip install` picked up 2.0 and the whole
    # system raised AttributeError while the lockless `>=1.1` looked fine.
    # Polars 2.0 is the same shape of risk, untested here. Every figure in
    # docs/results was produced on the 1.x line; moving the data layer is a
    # migration with its own re-evaluation, not a version bump.
    "duckdb>=1.1,<2",
    "pandas>=2.2",
    "polars>=1.1,<2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    # Capped below 2.14: it stops emitting `pattern` in the JSON schema for
    # constrained strings, which silently drops the money regex from 13 fields
    # of the committed contract - the rule that money travels as a string
    # (convention 11), expressed in the one artefact the frontend compiles
    # against. The schema-drift test catches it; the pin stops it happening.
    "pydantic>=2.9,<2.14",
    "pydantic-settings>=2.5",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
spendguard = "spendguard.cli:app"

[project.optional-dependencies]

# Phase 2-4: detection and evaluation
detect = [
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

# Local experiment tracking (FR-7.10). Optional on purpose: CI does not install
# this, and `eval/tracking.py` reports and carries on without it, because the
# durable record of a run is `eval_runs` + `eval_results` in DuckDB either way.
# Verified against 3.17.2, which is also why the backend is SQLite rather than
# the `./mlruns` file store every tutorial shows - 3.x raises on that store.
track = [
    "mlflow>=2.16",
]

# Phase 5-7, the light half: the LLM client and token counting. A few megabytes.
# Split out from `agent` because CI could not install the heavy half, which meant
# the 24 tests covering rate limits, quota handling and retries never ran there -
# CI was red from Phase 5 to Phase 9 and nobody noticed.
llm = [
    "openai>=1.50",
    "tiktoken>=0.8",
]

# Phase 5-7, the heavy half: policy retrieval, which pulls PyTorch through
# sentence-transformers. Installed only when needed.
agent = [
    "spendguard[llm]",
    "sentence-transformers>=3.1",
    "faiss-cpu>=1.8",
]

# Phase 8: API
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "httpx>=0.27",
]

# Optional D1 stage 3. Explicitly an upgrade, not a dependency (see docs/DECISIONS.md D-12).
linkage = [
    "splink>=4.0",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a couple of seconds",
    "llm: requires a reachable LLM endpoint",
    "data: requires a real dataset to be present",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
