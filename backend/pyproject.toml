[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spendguard"
version = "0.1.0"
description = "Multi-agent system for evidence-grounded detection and investigation of procurement spend anomalies"
requires-python = ">=3.11"

# Core: needed from Phase 1 onward. Kept deliberately light.
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]

# Phase 2-4: detection and evaluation
detect = [
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "rapidfuzz>=3.9",
    "pyod>=2.0",
    "Faker>=30.0",
]

# Phase 10: experiment tracking
track = [
    "mlflow>=2.16",
]

# Phase 5-7: agents and policy retrieval. Heavy - installed only when needed.
agent = [
    "openai>=1.50",
    "sentence-transformers>=3.1",
    "faiss-cpu>=1.8",
    "tiktoken>=0.8",
]

# Phase 8: API
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "httpx>=0.27",
]

# Optional D1 stage 3. Explicitly an upgrade, not a dependency (see docs/DECISIONS.md D-12).
linkage = [
    "splink>=4.0",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a couple of seconds",
    "llm: requires a reachable LLM endpoint",
    "data: requires a real dataset to be present",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
